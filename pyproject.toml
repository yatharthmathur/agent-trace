[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Local flight recorder for AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Yatharth Mathur", email = "yatharth.mathur@gmail.com" },
]
keywords = ["agents", "tracing", "observability"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/yatharthmathur/agent-trace"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttrace"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.12",
  "ty>=0.0.10",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "B",
  "E",
  "F",
  "I",
  "N",
  "RUF",
  "SIM",
  "TC",
  "UP",
  "W",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
